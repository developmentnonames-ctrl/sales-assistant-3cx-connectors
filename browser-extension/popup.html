<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sales Assistant for 3CX</title>
<style>
  :root { --bg: #f4f6f8; --card: #ffffff; --fg: #17202a; --muted: #5d6b78; --line: #d3dbe3; --accent: #1f6feb;
          --good: #12805c; --warn: #b26a00; --bad: #c2362f; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161c; --card: #1a2129; --fg: #e3e9ef; --muted: #93a1ae; --line: #2e3a46; --accent: #5aa0ff;
            --good: #3cc58f; --warn: #e3a33b; --bad: #f07269; color-scheme: dark; }
  }
  [hidden] { display: none !important; }
  body { margin: 0; width: 320px; font: 13px/1.45 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  main { padding: 14px; display: grid; gap: 12px; }
  h1 { font-size: 14px; margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; display: grid; gap: 6px; }
  .row { display: flex; justify-content: space-between; gap: 8px; }
  .good { color: var(--good); font-weight: 700; } .warn { color: var(--warn); font-weight: 700; } .muted { color: var(--muted); }
  button { font: inherit; font-weight: 600; padding: 8px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .note { color: var(--muted); font-size: 11.5px; margin: 0; }
  .err { color: var(--bad); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>Sales Assistant for 3CX</h1>
  <section class="card">
    <div class="row"><span>3CX tab</span><span id="hook">…</span></div>
    <div class="row"><span>Call</span><span id="call">…</span></div>
    <div class="row"><span>Live Call screen</span><span id="pages">…</span></div>
  </section>
  <p class="note" id="hint"></p>
  <section class="card" id="backup" hidden>
    <span>Backup: if the call sound doesn't reach the assistant, use this tab's sound instead (the customer only).</span>
    <button id="grant" type="button">Use this tab</button>
    <div class="err" id="error" role="alert"></div>
  </section>
  <p class="note" id="version"></p>
</main>
<script src="popup.js"></script>
</body>
</html>
